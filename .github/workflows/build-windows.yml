# 手动打一个 Windows 单文件 exe：Actions → 「打包 Windows 版」→ Run workflow。
#
# 为什么不挂在 push 上：PyInstaller 不能交叉编译，一台 runner 只能出它自己系统的包；
# 一轮下载 Qt 轮子 + 跑三份冒烟 + 打包约十分钟，而仓库里多数提交是文档和界面微调，
# 每次 push 都出一个没人测过的包反而更容易拿错版本。
#
# 产物以「草稿 Release」形式发布，你在 Releases 页面确认后点 Publish；
# 同时保留一份 Artifacts 备份（带 run number，与线上资产一一对应）。
# exe 走英文名 xhs-live-recorder-<版本>.exe，附同名 zip 与 SHA256SUMS.txt。
# ffmpeg 不打包，靠系统 PATH 或放在 exe 同目录；未做代码签名，别人第一次
# 运行可能被 SmartScreen 拦一次。
name: 打包 Windows 版

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（当 Release 标签用，形如 v1.0.0）"
        required: true
        type: string
      retention:
        description: "Artifacts 备份保留天数（Release 本身无过期）"
        type: choice
        default: "30"
        options:
          - "1"
          - "7"
          - "30"
          - "90"

# 建 Release / 删旧草稿 / 推删 tag 都需要写权限，默认的只读 token 会被 403
permissions:
  contents: write

# 同一时间只让一条构建在跑；正在跑的不清掉，避免手滑把别人等的包取消
concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    # runner 是英文区域，Python 的 stdout 默认 cp1252，三份冒烟一印中文就
    # UnicodeEncodeError（第一次跑就死在「静态检查」）。只压 stdout/stderr，
    # 不开 PYTHONUTF8=1：那会连 open() 的默认编码一起改掉，与本机环境差得更远。
    env:
      PYTHONIOENCODING: utf-8

    steps:
      # 放在最前面做快速失败：版本号格式不对或已经正式发布过，就没必要白跑十分钟打包。
      # 只查远端、不依赖代码，所以不需要先 checkout（GH_REPO 已给出仓库身份）。
      - name: 校验版本号并查旧 Release
        shell: pwsh
        run: |
          $ver = $env:VERSION

          # 1) 版本号格式（会直接当 tag 用，必须合法）
          if ([string]::IsNullOrWhiteSpace($ver)) {
            Write-Host "::error::版本号不能为空"
            exit 1
          }
          if ($ver -notmatch '^v?\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Host "::error::版本号 [$ver] 不合法：要形如 v1.0.0 或 1.0.0，它会直接当 Release 标签用"
            exit 1
          }

          # 2) 查现有 Release
          #    gh release view 查不到时返回码 1 并往 stderr 写一行，这是正常情况，
          #    这里自己接住 $LASTEXITCODE，绝不让它成为脚本的最终退出码。
          $ErrorActionPreference = 'Continue'
          $raw = gh release view $ver --json isDraft,tagName 2>$null
          $ghCode = $LASTEXITCODE

          if ($ghCode -eq 0 -and $raw) {
            $rel = $raw | ConvertFrom-Json -ErrorAction SilentlyContinue
            if ($rel -and $rel.isDraft -eq $true) {
              Write-Host "::warning::$ver 已有一份草稿，发布步骤会先删再建"
            } elseif ($rel) {
              Write-Host "::error::$ver 已经正式发布过了，换个版本号再跑"
              exit 1
            }
          } else {
            Write-Host "$ver 尚无发布记录，继续"
          }

          Write-Host "版本号校验通过：$ver"
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}

      - name: 检出代码
        uses: actions/checkout@v4

      # 与开发机对齐：本机是 Python 3.14.x + PySide6 6.11.x。CI 换 Python 小版本
      # 等于换一份 Qt，界面差异只能靠那三份冒烟兜，没必要主动冒险。
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip

      # requirements.txt 里已经带着 pyinstaller（它只在打包时才用得上），一步装完
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 三份都得绿再打：测试挂了就没必要留一个明知有问题的产物
      - name: 静态检查
        run: python tests/static_check.py

      - name: 核心层冒烟
        run: python tests/smoke_core.py

      # smoke_gui.py 自己会把 Qt 切成 offscreen，runner 上没有交互桌面也过得去
      - name: 界面冒烟
        run: python tests/smoke_gui.py

      - name: 打包
        run: python -m PyInstaller recorder.spec --noconfirm

      # 用通配而不是写死中文名：runner 上的 PowerShell 读脚本走 UTF-8，能跑，
      # 但把中文留在日志里、把 *.exe 留在路径里，少一处编码差异少一处坑
      - name: 核对产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Host "::error::dist 里没有 exe，打包这一步没出东西"
            exit 1
          }
          Write-Host "产物: $($exe.Name)  $($exe.Length) 字节  改动于 $($exe.LastWriteTime)"
          Write-Host "md5: $((Get-FileHash $exe.FullName -Algorithm MD5).Hash.ToLower())"
          if ($exe.Length -lt 20000000) {
            Write-Host "::error::产物小于 20MB，多半是 PyInstaller 只写了引导壳就断了"
            exit 1
          }
          exit 0

      # 把产物整理成英文名 exe + zip + SHA256SUMS.txt，统一放进 release/ 目录
      - name: 整理发布文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $ver = $env:VERSION
          $src = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if ($null -eq $src) {
            Write-Host "::error::找不到 dist 下的 exe"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exeName = "xhs-live-recorder-$ver.exe"
          $zipName = "xhs-live-recorder-$ver-windows-x64.zip"
          $exeDst  = Join-Path "release" $exeName
          $zipDst  = Join-Path "release" $zipName

          Copy-Item $src.FullName $exeDst -Force

          # 打 zip（先清旧 zip，避免把上一次的包自己打进去）
          if (Test-Path $zipDst) { Remove-Item $zipDst -Force }
          Compress-Archive -Path $exeDst -DestinationPath $zipDst -CompressionLevel Optimal

          # SHA256 校验文件（标准两空格格式，sha256sum -c 可直接核）
          $lines = @()
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($_.Name)"
          }
          Set-Content -Path (Join-Path "release" "SHA256SUMS.txt") -Value $lines -Encoding ASCII

          Write-Host "准备好的发布资产："
          Get-ChildItem release -File | ForEach-Object { Write-Host "  $($_.Name)  $($_.Length) 字节" }
          exit 0
        env:
          VERSION: ${{ inputs.version }}

      # Artifacts 备份：与 Release 资产一一对应，只是多带一个 run number 存档
      - name: 上传 Artifacts 备份
        uses: actions/upload-artifact@v4
        with:
          name: xhs-live-recorder-windows-x64-run${{ github.run_number }}
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          retention-days: ${{ inputs.retention }}
          if-no-files-found: error

      - name: 发布草稿 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ver = $env:VERSION

          # 1) 先删同名草稿（第一次跑没草稿是正常的，gh 返回非 0 不算错）
          gh release delete $ver --yes --cleanup-tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "已清理旧草稿：$ver"
            # 保险：草稿删了但 tag 可能仍残留，再删一次；
            # tag 不存在时 git 会报非 0，属于预期，忽略即可。
            git push origin ":refs/tags/$ver" 2>$null | Out-Null
          } else {
            Write-Host "无需清理（本就没有同名草稿），继续"
          }

          # 2) 写 Release 说明（UTF-8 落盘，避免中文乱码；多行内容走文件不塞命令行）
          #    这里用「字符串数组 + 占位符替换」而不是 PowerShell here-string：
          #    here-string 的收尾 "@ 必须顶格，与 YAML 缩进块冲突，很容易踩坑。
          #    数组元素一律用单引号：反引号与 $ 都是字面量，无需转义。
          $notes = @(
            '## 小红书直播录制器 __VER__',
            '',
            '### 资产说明',
            '- `xhs-live-recorder-__VER__.exe` —— 单文件 exe，可直接运行。',
            '- `xhs-live-recorder-__VER__-windows-x64.zip` —— 上述 exe 的 zip 打包。',
            '- `SHA256SUMS.txt` —— 以上文件的 SHA256。下载后放同一目录，用',
            '  `sha256sum -c SHA256SUMS.txt` 核验，或',
            '  `certutil -hashfile xhs-live-recorder-__VER__.exe SHA256` 手动比对。',
            '',
            '### 使用提醒',
            '1. 确保系统 PATH 中有 `ffmpeg`，或将 `ffmpeg.exe` 放到 exe 同目录。',
            '2. 本构建未做代码签名，首次运行若被 Windows SmartScreen 拦截，',
            '   点“更多信息” → “仍要运行”即可。',
            '3. 本 Release 为草稿，核对无误后请手动点 Publish release。'
          ) -replace '__VER__', $ver
          $notes | Set-Content -Path release_notes.md -Encoding UTF8

          # 3) 建草稿 Release（--target 指向本次 commit，避免同名旧 tag 指错提交）
          gh release create $ver `
            --draft `
            --target $env:GITHUB_SHA `
            --title "小红书直播录制器 $ver (草稿)" `
            --notes-file release_notes.md `
            release/xhs-live-recorder-$ver.exe `
            release/xhs-live-recorder-$ver-windows-x64.zip `
            release/SHA256SUMS.txt

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::创建草稿 Release 失败（gh 退出码 $LASTEXITCODE）"
            exit 1
          }

          Write-Host ""
          Write-Host "草稿 Release 创建成功：$ver"
          Write-Host "前往 Releases 页面确认后点 Publish release 即可发布。"
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
